<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Timer</title>
<style>
  :root { --purple: #a855f7; --purple-dark: #7e22ce; --text: #f5f3ff; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    background: #000;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  /* Mode buttons: hidden until the mouse goes to the top of the page */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 56px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .modes { display: flex; gap: 6px; opacity: 0; transition: opacity .2s; }
  .topbar:hover .modes { opacity: 1; }

  #display {
    font-size: clamp(56px, 13vw, 120px);
    font-variant-numeric: tabular-nums;
    font-weight: 300;
    white-space: nowrap;
  }
  #display .frac { color: var(--purple); }
  #display.done { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .2; } }

  button {
    background: transparent;
    color: var(--purple);
    border: 1px solid var(--purple-dark);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  button:hover { background: #1a0b2e; }
  button.active { background: var(--purple-dark); color: var(--text); }

  .controls { display: flex; gap: 12px; }
  .controls .main {
    background: var(--purple);
    border-color: var(--purple);
    color: #000;
    font-weight: 600;
    min-width: 120px;
    padding: 8px 14px;
    font-size: 14px;
  }
  .controls .main:hover { background: #c084fc; }
  .controls #reset { padding: 8px 14px; font-size: 14px; }

  /* Preset and Start/Reset buttons: hidden until the mouse goes to the bottom of the page */
  .bottombar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 120px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    gap: 12px;
    padding-bottom: 24px;
  }
  .bottombar > * { opacity: 0; transition: opacity .2s; }
  .bottombar:hover > * { opacity: 1; }

  .presets { display: flex; gap: 8px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="modes">
      <button id="modeTimer" class="active">Timer</button>
      <button id="modeStopwatch">Stopwatch</button>
    </div>
  </div>

  <div id="display">25:00.00</div>

  <div class="bottombar">
    <div class="presets" id="presets">
      <button data-min="5">5</button>
      <button data-min="10">10</button>
      <button data-min="25" class="active">25</button>
      <button data-min="45">45</button>
      <button data-min="60">60</button>
    </div>

    <div class="controls">
      <button id="reset">Reset</button>
      <button id="main" class="main">Start</button>
    </div>
  </div>

<script>
(function () {
  const display = document.getElementById("display");
  const mainBtn = document.getElementById("main");
  const resetBtn = document.getElementById("reset");
  const presets = document.getElementById("presets");
  const presetBtns = presets.querySelectorAll("button");
  const modeTimer = document.getElementById("modeTimer");
  const modeStopwatch = document.getElementById("modeStopwatch");

  let mode = "timer";             // "timer" counts down, "stopwatch" counts up
  let totalMs = 25 * 60 * 1000;   // timer length
  let baseMs = totalMs;           // time before the current run started
  let startPerf = 0;              // performance.now() when the current run started
  let running = false;
  let frameId = null;

  // Format as MM:SS.cc (two decimals); adds hours past 59:59
  function fmt(ms) {
    const cs = Math.max(0, Math.floor(ms / 10));
    const frac = cs % 100;
    const totalSec = Math.floor(cs / 100);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    const pad = n => String(n).padStart(2, "0");
    const main = h > 0 ? h + ":" + pad(m) + ":" + pad(s) : pad(m) + ":" + pad(s);
    return main + '.<span class="frac">' + pad(frac) + "</span>";
  }

  function currentMs() {
    if (!running) return baseMs;
    const delta = performance.now() - startPerf;
    return mode === "timer" ? Math.max(0, baseMs - delta) : baseMs + delta;
  }

  function render() {
    display.innerHTML = fmt(currentMs());
    if (running) mainBtn.textContent = "Pause";
    else mainBtn.textContent = baseMs > 0 && baseMs !== totalMs || (mode === "stopwatch" && baseMs > 0) ? "Resume" : "Start";
  }

  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.4, 0.8].forEach(t => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = 660;
        gain.gain.value = 0.15;
        osc.connect(gain).connect(ctx.destination);
        osc.start(ctx.currentTime + t);
        osc.stop(ctx.currentTime + t + 0.25);
      });
    } catch (e) {}
  }

  function loop() {
    if (mode === "timer" && currentMs() <= 0) {
      baseMs = 0;
      running = false;
      display.classList.add("done");
      beep();
    } else {
      frameId = requestAnimationFrame(loop);
    }
    render();
  }

  function pause() {
    baseMs = currentMs();
    running = false;
    cancelAnimationFrame(frameId);
  }

  function start() {
    if (mode === "timer" && baseMs <= 0) baseMs = totalMs;
    display.classList.remove("done");
    startPerf = performance.now();
    running = true;
    frameId = requestAnimationFrame(loop);
  }

  function reset() {
    pause();
    baseMs = mode === "timer" ? totalMs : 0;
    display.classList.remove("done");
    render();
  }

  function setLength(mins) {
    pause();
    totalMs = mins * 60 * 1000;
    baseMs = totalMs;
    display.classList.remove("done");
    presetBtns.forEach(b => b.classList.toggle("active", Number(b.dataset.min) === mins));
    render();
  }

  function setMode(next) {
    pause();
    mode = next;
    modeTimer.classList.toggle("active", mode === "timer");
    modeStopwatch.classList.toggle("active", mode === "stopwatch");
    presets.classList.toggle("hidden", mode !== "timer");
    baseMs = mode === "timer" ? totalMs : 0;
    display.classList.remove("done");
    render();
  }

  mainBtn.addEventListener("click", () => {
    if (running) pause(); else start();
    render();
  });

  resetBtn.addEventListener("click", reset);

  presetBtns.forEach(btn => {
    btn.addEventListener("click", () => setLength(Number(btn.dataset.min)));
  });

  modeTimer.addEventListener("click", () => setMode("timer"));
  modeStopwatch.addEventListener("click", () => setMode("stopwatch"));

  document.addEventListener("keydown", e => {
    if (e.code === "Space") { e.preventDefault(); mainBtn.click(); }
    if (e.key === "r" || e.key === "R") resetBtn.click();
  });

  render();
})();
</script>
</body>
</html>
